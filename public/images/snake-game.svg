<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#111827" rx="8"/>
  
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#374151" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Game border -->
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="#4B5563" stroke-width="2" rx="4"/>
  
  <!-- Snake body segments -->
  <rect x="140" y="140" width="18" height="18" fill="#22D3EE" rx="2" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.7;0.9" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="140" width="18" height="18" fill="#22D3EE" rx="2" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.6;0.8" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="180" y="140" width="18" height="18" fill="#22D3EE" rx="2" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Snake head (brighter with glow effect) -->
  <rect x="200" y="140" width="18" height="18" fill="#22D3EE" rx="2">
    <animate attributeName="fill" values="#22D3EE;#06B6D4;#22D3EE" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Snake head glow effect -->
  <rect x="198" y="138" width="22" height="22" fill="none" stroke="#22D3EE" stroke-width="1" rx="3" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Apple -->
  <circle cx="280" cy="100" r="8" fill="#EF4444">
    <animate attributeName="r" values="8;9;8" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="100" r="12" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Apple stem -->
  <path d="M 280 92 Q 278 88 276 90" stroke="#10B981" stroke-width="2" fill="none"/>
  
  <!-- Score display -->
  <text x="30" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F3F4F6">Score: 150</text>
  
  <!-- Game title -->
  <text x="200" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#22D3EE" text-anchor="middle">SNAKE GAME</text>
  
  <!-- Movement trail effect -->
  <rect x="120" y="140" width="18" height="18" fill="#22D3EE" rx="2" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Subtle background pattern -->
  <circle cx="320" cy="220" r="2" fill="#374151" opacity="0.2"/>
  <circle cx="80" cy="80" r="2" fill="#374151" opacity="0.2"/>
  <circle cx="340" cy="60" r="2" fill="#374151" opacity="0.2"/>
  <circle cx="60" cy="240" r="2" fill="#374151" opacity="0.2"/>
</svg>
